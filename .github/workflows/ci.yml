name: Validate AgentBridge

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate source and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q plugins/agent-bridge/scripts tests scripts
          bash -n plugins/agent-bridge/scripts/*.sh
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/agent-bridge/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/agent-bridge/.mcp.json >/dev/null
          python -m json.tool plugins/agent-bridge/config/agents.example.json >/dev/null
